<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas — Lista Enlazada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Tareas pendientes</h1>
        <p class="subtitle">Estructura de datos: lista enlazada simple (nodos + punteros)</p>
      </header>

      <form id="task-form" class="add-form">
        <input
          id="task-input"
          type="text"
          placeholder="¿Qué necesitas hacer?"
          maxlength="200"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-primary">Agregar</button>
      </form>

      <p id="error" class="error" role="alert" hidden></p>

      <ul id="task-list" class="task-list"></ul>

      <p id="empty-state" class="empty-state">
        <span class="empty-state__icon">✓</span>
        No hay tareas todavía. Agrega la primera arriba.
      </p>

      <footer class="footer">
        <p id="summary" class="summary" hidden></p>
        <button id="clear-completed" type="button" class="btn-ghost" hidden>Borrar completadas</button>
      </footer>
    </main>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
